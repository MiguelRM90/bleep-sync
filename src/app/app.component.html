<div class="min-h-screen flex flex-col bg-slate-950 text-slate-100 font-sans pb-10">
  <!-- Header with Clinical Status and Settings -->
  <app-header
    (openConfig)="isConfigOpen.set(true)"
    (openTutorial)="isTutorialOpen.set(true)"
  ></app-header>

  <!-- PWA Install Prompt Banner (if deferred prompt is caught) -->
  @if (deferredPrompt() !== null) {
    <aside class="bg-emerald-950/80 border-b border-emerald-500/30 px-4 py-2.5">
      <div class="max-w-xl mx-auto flex items-center justify-between gap-3 text-xs">
        <div class="flex items-center gap-2">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
          <span class="text-emerald-200 font-medium">Instala BleepSync en tu móvil para uso offline en quirófano</span>
        </div>
        <button
          (click)="installPwa()"
          class="px-3 py-1 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold rounded-lg transition tactile-btn shrink-0"
        >
          Instalar App
        </button>
      </div>
    </aside>
  }

  <!-- Main Content Container -->
  <main class="max-w-xl w-full mx-auto px-4 py-6 sm:py-8 flex flex-col gap-6 sm:gap-7 flex-1">
    <!-- Duty Checker: Colleague Selector & Dynamic Recommendation -->
    <app-duty-checker
      (recommendationApplied)="onRecommendationApplied($event)"
      (openColleagueManager)="isColleagueModalOpen.set(true)"
    ></app-duty-checker>

    <!-- Duty Logger: Large Touch Targets & Tactile Submission -->
    <app-duty-logger></app-duty-logger>

    <!-- Metrics & Shift History Timeline -->
    <app-metrics-summary
      (openColleagueManager)="isColleagueModalOpen.set(true)"
    ></app-metrics-summary>
  </main>

  <!-- Footer Info -->
  <footer class="max-w-xl mx-auto px-4 pt-4 text-center text-xs text-slate-500">
    <p class="flex items-center justify-center gap-2 font-medium flex-wrap">
      <span>BleepSync PWA</span>
      <span>•</span>
      <span>Respaldo con Google Sheets</span>
      <span>•</span>
      <button
        type="button"
        (click)="isTutorialOpen.set(true)"
        class="text-emerald-400 hover:text-emerald-300 underline underline-offset-2 transition cursor-pointer"
      >
        📖 Guía de uso
      </button>
      <span>•</span>
      <a
        href="https://github.com/MiguelRM90/bleep-sync/blob/main/docs/PRIVACY_POLICY.md"
        target="_blank"
        rel="noopener noreferrer"
        class="text-slate-400 hover:text-slate-200 underline underline-offset-2 transition inline-flex items-center gap-1"
      >
        <span>🔒 Privacidad</span>
      </a>
    </p>
  </footer>

  <!-- Configuration Modal -->
  @if (isConfigOpen()) {
    <app-config-modal
      (close)="isConfigOpen.set(false)"
      (openColleagueManager)="isColleagueModalOpen.set(true)"
      (openTutorial)="isTutorialOpen.set(true)"
    ></app-config-modal>
  }

  <!-- Colleague & Previous History Modal -->
  @if (isColleagueModalOpen()) {
    <app-colleague-modal
      (close)="isColleagueModalOpen.set(false)"
      (colleagueSelected)="onColleagueAddedOrSelected($event)"
    ></app-colleague-modal>
  }

  <!-- Tutorial & Getting Started Modal -->
  @if (isTutorialOpen()) {
    <app-tutorial-modal
      [deferredPrompt]="deferredPrompt()"
      (close)="isTutorialOpen.set(false)"
      (openColleagueManager)="isColleagueModalOpen.set(true)"
      (openConfig)="isConfigOpen.set(true)"
      (installPwa)="installPwa()"
    ></app-tutorial-modal>
  }

  <!-- Toast Feedback Floating Notification -->
  <pwa-toast-container />
</div>
