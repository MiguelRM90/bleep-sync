<section class="clinical-card p-6 sm:p-7 transition-all">
  <!-- Section Header -->
  <div class="flex items-center gap-3 mb-6">
    <span class="w-10 h-10 rounded-xl bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 flex items-center justify-center font-bold text-sm shadow-sm shrink-0">
      2
    </span>
    <div>
      <h2 class="text-base sm:text-lg font-bold text-slate-100 tracking-tight">Registro de Guardia</h2>
      <p class="text-xs text-slate-400 mt-1">Guarda la asignación de busca en el parte quirúrgico</p>
    </div>
  </div>

  <form (ngSubmit)="saveShift()" class="flex flex-col gap-6">
    <!-- Date & Colleague row -->
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 sm:gap-5">
      <!-- Date selector -->
      <div class="flex flex-col gap-2">
        <label for="shiftDate" class="block text-xs font-semibold uppercase tracking-wider text-slate-300">
          Fecha de la guardia
        </label>
        <input
          type="date"
          id="shiftDate"
          [(ngModel)]="date"
          name="date"
          required
          class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3.5 text-sm text-slate-100 focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/30 transition font-medium shadow-inner min-h-[48px]"
        />
      </div>

      <!-- Colleague display / override -->
      <div class="flex flex-col gap-2">
        <label for="colleagueInput" class="block text-xs font-semibold uppercase tracking-wider text-slate-300">
          Adjunto con quien estás
        </label>
        <input
          type="text"
          id="colleagueInput"
          [(ngModel)]="colleague"
          name="colleague"
          placeholder="Ej: Dra. Carmen Navarro"
          required
          class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3.5 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/30 transition font-medium shadow-inner min-h-[48px]"
        />
      </div>
    </div>

    <!-- Role Assignment - Large tactile touch targets -->
    <div class="flex flex-col gap-3">
      <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300">
        Asignación de Busca / Localizador <span class="text-emerald-400 font-semibold">*</span>
      </label>
      <div class="grid grid-cols-3 gap-3 sm:gap-4">
        <!-- Planta (Ward) Button -->
        <button
          type="button"
          (click)="selectRole('Planta')"
          class="h-18 sm:h-20 rounded-2xl flex flex-col items-center justify-center gap-1.5 transition-all tactile-btn border text-center font-bold cursor-pointer p-3"
          [ngClass]="{
            'bg-sky-500/25 text-sky-200 border-sky-500 ring-2 ring-sky-500/40 shadow-lg shadow-sky-950/50': role() === 'Planta',
            'bg-slate-900/90 text-slate-300 border-slate-700 hover:border-slate-600 hover:bg-slate-800/60': role() !== 'Planta'
          }"
        >
          <div class="flex items-center gap-1.5 text-sm sm:text-base">
            <svg class="w-4 h-4 text-sky-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path>
            </svg>
            <span>Planta</span>
          </div>
          <span class="text-[10px] sm:text-[11px] font-normal text-slate-400">Hospitalización</span>
        </button>

        <!-- Urgencias (Emergency) Button -->
        <button
          type="button"
          (click)="selectRole('Urgencias')"
          class="h-18 sm:h-20 rounded-2xl flex flex-col items-center justify-center gap-1.5 transition-all tactile-btn border text-center font-bold cursor-pointer p-3"
          [ngClass]="{
            'bg-emerald-500/25 text-emerald-200 border-emerald-500 ring-2 ring-emerald-500/40 shadow-lg shadow-emerald-950/50': role() === 'Urgencias',
            'bg-slate-900/90 text-slate-300 border-slate-700 hover:border-slate-600 hover:bg-slate-800/60': role() !== 'Urgencias'
          }"
        >
          <div class="flex items-center gap-1.5 text-sm sm:text-base">
            <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
            </svg>
            <span>Urgencias</span>
          </div>
          <span class="text-[10px] sm:text-[11px] font-normal text-slate-400">Boxes / Quirófano</span>
        </button>

        <!-- Ambos (Both/Exception) Button -->
        <button
          type="button"
          (click)="selectRole('Ambos')"
          class="h-18 sm:h-20 rounded-2xl flex flex-col items-center justify-center gap-1.5 transition-all tactile-btn border text-center font-bold cursor-pointer p-3"
          [ngClass]="{
            'bg-purple-500/25 text-purple-200 border-purple-500 ring-2 ring-purple-500/40 shadow-lg shadow-purple-950/50': role() === 'Ambos',
            'bg-slate-900/90 text-slate-300 border-slate-700 hover:border-slate-600 hover:bg-slate-800/60': role() !== 'Ambos'
          }"
        >
          <div class="flex items-center gap-1.5 text-sm sm:text-base">
            <svg class="w-4 h-4 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"></path>
            </svg>
            <span>Ambos</span>
          </div>
          <span class="text-[10px] sm:text-[11px] font-normal text-slate-400">Mixta / Excepción</span>
        </button>
      </div>
    </div>

    <!-- Notes / Remarks (Swaps, Favors, Coverage) -->
    <div class="flex flex-col gap-2">
      <label for="notesInput" class="block text-xs font-semibold uppercase tracking-wider text-slate-300">
        Observaciones o cambios (opcional)
      </label>
      <input
        type="text"
        id="notesInput"
        [(ngModel)]="notes"
        name="notes"
        placeholder="Ej: Cambio de guardia por congreso, favor devuelto, paciente crítico..."
        class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3.5 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/30 transition shadow-inner min-h-[48px]"
      />
    </div>

    <!-- Prominent Save Button with Tactile & Visual Confirmation -->
    <div class="pt-2">
      <button
        type="submit"
        [disabled]="!canSave() || isSubmitting()"
        class="w-full h-14 py-4 px-6 rounded-2xl font-bold text-white text-base tracking-wide transition-all shadow-xl flex items-center justify-center gap-3 tactile-btn cursor-pointer"
        [ngClass]="{
          'bg-gradient-to-r from-emerald-600 via-emerald-500 to-teal-600 hover:from-emerald-500 hover:to-teal-500 shadow-emerald-950/60 border border-emerald-400/30': canSave() && !isSubmitting(),
          'bg-slate-800 text-slate-500 border border-slate-700 cursor-not-allowed': !canSave() || isSubmitting()
        }"
      >
        @if (isSubmitting()) {
          <span class="w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
          <span>Guardando parte...</span>
        } @else if (justSaved()) {
          <svg class="w-5 h-5 text-emerald-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path>
          </svg>
          <span class="text-emerald-100">¡Guardia Registrada!</span>
        } @else {
          <!-- Medical cross save icon -->
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"></path>
          </svg>
          <span>Guardar Guardia</span>
        }
      </button>
    </div>
  </form>
</section>
