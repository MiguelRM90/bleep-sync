<pwa-header
  [title]="'BleepSync'"
  [subtitle]="shiftService.config().currentSurgeonName"
  [badgeText]="'Guardias'"
  [showInstallButton]="false"
  [showNetworkStatus]="true"
>
  <!-- Header Logo Slot -->
  <div header-logo class="flex items-center gap-2.5">
    <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-emerald-500 to-teal-700 flex items-center justify-center shadow-md shadow-emerald-500/20 border border-emerald-400/30">
      <svg class="w-5 h-5 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="6" width="20" height="14" rx="3"></rect>
        <line x1="6" y1="10" x2="14" y2="10"></line>
        <line x1="6" y1="13" x2="10" y2="13"></line>
        <circle cx="17.5" cy="11.5" r="1.5" fill="currentColor"></circle>
        <path d="M6 3v3"></path>
      </svg>
    </div>
  </div>

  <!-- Header Actions Slot -->
  <div header-actions class="flex items-center gap-2">
    <!-- Pending sync badge / button -->
    @if (shiftService.pendingSyncCount() > 0) {
      <button
        type="button"
        (click)="shiftService.syncPendingShifts()"
        [disabled]="shiftService.isSyncing()"
        class="flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold bg-amber-500/15 text-amber-300 border border-amber-500/30 hover:bg-amber-500/25 transition tactile-btn cursor-pointer"
        title="Guardias pendientes de sincronizar con Google Sheets. Haz clic para sincronizar."
      >
        @if (shiftService.isSyncing()) {
          <span class="inline-block w-2.5 h-2.5 border-2 border-amber-400 border-t-transparent rounded-full animate-spin"></span>
        } @else {
          <svg class="w-3.5 h-3.5 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
          </svg>
        }
        <span>{{ shiftService.pendingSyncCount() }} pend.</span>
      </button>
    }

    <!-- Google Drive Status / Connect Button -->
    <button
      (click)="onGoogleDriveClick()"
      [disabled]="shiftService.googleAuthService.isAuthenticating()"
      type="button"
      class="flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold transition tactile-btn border cursor-pointer disabled:opacity-60 disabled:cursor-not-allowed"
      [ngClass]="{
        'bg-emerald-950/40 text-emerald-300 border-emerald-700/40 hover:bg-emerald-900/40': shiftService.googleAuthService.isConnected(),
        'bg-amber-500/15 text-amber-300 border-amber-500/35 hover:bg-amber-500/25 shadow-sm shadow-amber-950/30': !shiftService.googleAuthService.isConnected()
      }"
      [title]="shiftService.googleAuthService.isConnected() ? 'Google Drive conectado (' + (shiftService.googleAuthService.userProfile()?.email || 'Activo') + '). Clic para abrir ajustes.' : 'Google Drive no conectado. Haz clic para iniciar sesión y sincronizar tus guardias.'"
    >
      @if (shiftService.googleAuthService.isAuthenticating()) {
        <span class="inline-block w-3 h-3 border-2 border-amber-400 border-t-transparent rounded-full animate-spin"></span>
        <span class="hidden sm:inline">Conectando...</span>
      } @else if (shiftService.googleAuthService.isConnected()) {
        <svg class="w-3.5 h-3.5 text-emerald-400 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 16.9A5 5 0 0 0 18 7h-1.26a8 8 0 1 0-11.62 9"></path>
          <polyline points="9 13 12 16 20 8"></polyline>
        </svg>
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
        <span class="hidden sm:inline">Drive</span>
      } @else {
        <svg class="w-3.5 h-3.5 shrink-0" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.8-2.4 3.65v3.03h3.88c2.27-2.09 3.58-5.17 3.58-9.12z"/>
          <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.03c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.13C3.26 21.36 7.33 24 12 24z"/>
          <path fill="#FBBC05" d="M5.28 14.29c-.25-.72-.38-1.49-.38-2.29s.13-1.57.38-2.29V6.58H1.25C.45 8.18 0 9.99 0 12s.45 3.82 1.25 5.42l4.03-3.13z"/>
          <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.13c.95-2.83 3.6-4.96 6.72-4.96z"/>
        </svg>
        <span class="hidden sm:inline">Conectar Drive</span>
        <span class="sm:hidden">Conectar</span>
      }
    </button>

    <!-- Tutorial / Help Guide button -->
    <button
      (click)="openTutorial.emit()"
      type="button"
      class="w-9 h-9 rounded-xl bg-slate-900/40 text-emerald-400 hover:text-emerald-300 hover:bg-emerald-950/40 transition tactile-btn border border-emerald-500/20 hover:border-emerald-500/40 cursor-pointer flex items-center justify-center"
      title="Tutorial y Guía de Uso de BleepSync"
      aria-label="Tutorial y Guía de Uso"
    >
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
      </svg>
    </button>

    <!-- Settings Cog button -->
    <button
      (click)="openConfig.emit()"
      type="button"
      class="w-9 h-9 rounded-xl bg-slate-900/40 text-slate-400 hover:text-slate-200 hover:bg-slate-800 transition tactile-btn border border-slate-700/40 hover:border-slate-600 cursor-pointer flex items-center justify-center"
      title="Ajustes y conexión Google Sheets"
      aria-label="Ajustes y configuración"
    >
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
        <circle cx="12" cy="12" r="3"></circle>
      </svg>
    </button>
  </div>
</pwa-header>
