<pwa-modal
  [isOpen]="true"
  [title]="title()"
  [subtitle]="subtitle()"
  [closeOnBackdrop]="closeOnBackdropClick()"
  [maxWidth]="'36rem'"
  (close)="close.emit()"
>
  <ng-content select="[modal-icon]" modal-icon></ng-content>
  <ng-content></ng-content>
  <ng-content select="[modal-footer]" modal-footer></ng-content>
</pwa-modal>
