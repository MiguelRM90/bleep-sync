<!-- Accessible Reusable Modal Backdrop -->
<div
  class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-3 sm:p-6 animate-fade-in"
  (click)="onBackdropClick($event)"
  role="dialog"
  aria-modal="true"
  tabindex="-1"
>
  <div
    class="bg-slate-900 border border-slate-700 rounded-3xl w-full max-h-[92vh] flex flex-col shadow-2xl overflow-hidden"
    [ngClass]="maxWidthClass()"
    (click)="$event.stopPropagation()"
  >
    <!-- Modal Header -->
    <header class="px-6 py-5 border-b border-slate-800 flex items-center justify-between bg-slate-950/80 backdrop-blur-md shrink-0">
      <div class="flex items-center gap-3">
        <ng-content select="[modal-icon]"></ng-content>
        <div>
          @if (title()) {
            <h3 class="text-base sm:text-lg font-bold text-slate-100">{{ title() }}</h3>
          }
          @if (subtitle()) {
            <p class="text-xs text-slate-400 mt-0.5">{{ subtitle() }}</p>
          }
          <ng-content select="[modal-title-custom]"></ng-content>
        </div>
      </div>

      <button
        type="button"
        (click)="close.emit()"
        class="p-2 rounded-xl text-slate-400 hover:text-slate-200 hover:bg-slate-800 transition active:scale-95 cursor-pointer"
        aria-label="Cerrar modal"
      >
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </button>
    </header>

    <!-- Modal Body (Scrollable) -->
    <div class="p-5 sm:p-7 overflow-y-auto flex flex-col gap-6 text-sm flex-1">
      <ng-content></ng-content>
    </div>

    <!-- Modal Footer -->
    <footer class="px-6 py-4 border-t border-slate-800 flex items-center justify-end gap-3 bg-slate-950/80 backdrop-blur-md shrink-0">
      <ng-content select="[modal-footer]"></ng-content>
    </footer>
  </div>
</div>
